<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#355872"/>
      <stop offset="100%" stop-color="#1A2D3C"/>
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9CD5FF"/>
      <stop offset="100%" stop-color="#E2F1FF"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle App Icon Background -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  <rect width="62" height="62" x="1" y="1" rx="15" fill="none" stroke="#7AAACE" stroke-width="1.5" stroke-opacity="0.5"/>

  <!-- Heart Base Outline -->
  <path
    d="M48 24.5 C48 18.7 43.3 14 37.5 14 C34.2 14 31.8 15.6 32 17.5 C32.2 15.6 29.8 14 26.5 14 C20.7 14 16 18.7 16 24.5 C16 31 22 36.5 32 46.5 C42 36.5 48 31 48 24.5 Z"
    fill="#233B4D"
    fill-opacity="0.8"
    stroke="#7AAACE"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Glowing Heart Pulse / ECG Waveform -->
  <path
    d="M12 28.5 H22 L24 23 L28.5 35 L33.5 20 L37 28.5 H52"
    fill="none"
    stroke="url(#pulseGrad)"
    stroke-width="3"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#glow)"
  />

  <!-- Subtle pulse accent dot -->
  <circle cx="33.5" cy="20" r="2" fill="#E2F1FF"/>
</svg>